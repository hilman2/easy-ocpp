name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
          - os: ubuntu-latest
            suffix: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Release)
        run: cargo build --release --locked

      - name: Paketieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist\easy-ocpp | Out-Null
          Copy-Item target\release\easy-ocpp.exe, config.example.toml, LICENSE dist\easy-ocpp\
          Copy-Item README*.md, ANLEITUNG.md, INSTALL*.md dist\easy-ocpp\
          Compress-Archive -Path dist\easy-ocpp -DestinationPath "dist\easy-ocpp-${{ github.ref_name }}-${{ matrix.suffix }}.zip"

      - name: Paketieren (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/easy-ocpp
          cp target/release/easy-ocpp config.example.toml LICENSE dist/easy-ocpp/
          cp README*.md ANLEITUNG.md INSTALL*.md dist/easy-ocpp/
          tar -C dist -czf "dist/easy-ocpp-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz" easy-ocpp

      - uses: actions/upload-artifact@v4
        with:
          name: easy-ocpp-${{ matrix.suffix }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

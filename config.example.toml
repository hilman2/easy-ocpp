# easy-ocpp – Beispielkonfiguration
# Speichere diese Datei als config.toml und passe sie an.

[http]
bind = "0.0.0.0:8080"
public_base_url = "http://localhost:8080"

[storage]
data_dir = "data"
db_file  = "easy-ocpp.db"
# Wie lange die Meldungen der Wallboxen aufgehoben werden. 0 = unbegrenzt.
event_retention_days = 60

[ocpp]
# Intervall in Sekunden, in dem Wallboxen während einer Ladung Zählerstand und
# Leistung melden (MeterValues). Wird beim Verbinden automatisch in der Wallbox
# gesetzt (ChangeConfiguration). 0 = Auto-Konfiguration deaktivieren.
meter_interval_s = 30

# Monatsversand der Ladeberichte. Fehlt dieser Abschnitt, wird nichts
# verschickt. Am Monatsersten bekommt jeder Benutzer mit E-Mail-Adresse, der im
# Vormonat geladen hat, seinen eigenen Bericht als PDF.
# [mail]
# smtp_host  = "smtp.example.com"
# smtp_port  = 587
# security   = "starttls"          # starttls | tls | none
# username   = "..."
# password   = "..."
# from       = "easy-ocpp <noreply@example.com>"
# lang       = "de"                # Sprache der Mails: de | en | fr | es
# send_hour  = 6                   # Stunde am Monatsersten (lokale Zeit)

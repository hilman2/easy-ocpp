# easy-ocpp – Beispielkonfiguration
# Speichere diese Datei als config.toml und passe sie an.

[http]
bind = "0.0.0.0:8080"
public_base_url = "http://localhost:8080"

[storage]
data_dir = "data"
db_file  = "easy-ocpp.db"

[ocpp]
# Intervall in Sekunden, in dem Wallboxen während einer Ladung Zählerstand und
# Leistung melden (MeterValues). Wird beim Verbinden automatisch in der Wallbox
# gesetzt (ChangeConfiguration). 0 = Auto-Konfiguration deaktivieren.
meter_interval_s = 30

# Optional: Active Directory (LDAP) – noch nicht aktiv, Feld-Stub.
# [auth.ldap]
# url = "ldap://dc.firma.local:389"
# bind_dn = "CN=svc-easy-ocpp,OU=Service,DC=firma,DC=local"
